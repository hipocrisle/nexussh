name: SSH transport diagnostic (Windows)

on:
  workflow_dispatch: {}
  push:
    branches: [fix/ssh-banner-probe]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            desktop/src-tauri/target/
          key: windows-cargo-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: Windows-cargo-
      - name: Test transport observer before packaging
        timeout-minutes: 5
        run: cargo test --manifest-path tests/ssh_transport_harness/Cargo.toml
      - name: Install frontend dependencies
        working-directory: desktop
        run: npm ci
      - name: Fetch Windows sidecar
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force desktop/src-tauri/binaries | Out-Null
          Invoke-WebRequest https://github.com/XTLS/Xray-core/releases/latest/download/Xray-windows-64.zip -OutFile xray.zip
          Expand-Archive xray.zip -DestinationPath xray_tmp
          Copy-Item xray_tmp/xray.exe desktop/src-tauri/binaries/xray-x86_64-pc-windows-msvc.exe
          Remove-Item xray.zip
          Remove-Item xray_tmp -Recurse
      - name: Build diagnostic installer (no release or updater publication)
        working-directory: desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --target x86_64-pc-windows-msvc --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: nexussh-ssh-diagnostic-windows
          path: desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7
