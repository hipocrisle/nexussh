# Проверка сборки под macOS — отдельно от релизного пути.
#
# ⛔ Зачем отдельный файл: macOS в клиенте ещё не поддерживается, и
# неудачная проверка не должна ронять релизные сборки и трогать ключ
# подписи. Запускается только руками (workflow_dispatch), секретов не
# просит, артефактов не публикует.
#
# Собираем не бинарь, а проверку компиляции: цель — выяснить, какой код
# не переносится, а не получить .dmg. Это минуты вместо десятков минут.
name: macOS check (experimental)

on:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: macos-latest        # arm64 (Apple silicon)
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Rust stable (Apple + Intel)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            desktop/src-tauri/target/
          key: macos-cargo-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: macos-cargo-

      # Окно собирается заранее: сборочный скрипт Tauri требует готовый
      # каталог dist, иначе падает ещё до компиляции Rust.
      - name: Build frontend
        working-directory: desktop
        run: |
          npm ci
          npm run build

      - name: Check Apple silicon
        working-directory: desktop/src-tauri
        run: cargo check --target aarch64-apple-darwin --all-targets 2>&1 | tail -80

      - name: Check Intel
        working-directory: desktop/src-tauri
        run: cargo check --target x86_64-apple-darwin --all-targets 2>&1 | tail -80

      # Движок VPN вшивается в приложение как sidecar. Tauri ищет файл с
      # суффиксом целевой тройки, поэтому для универсальной сборки кладём и
      # обе архитектуры, и склеенный lipo вариант — что бы он ни спросил.
      - name: Fetch xray-core (both architectures + universal)
        working-directory: desktop/src-tauri
        run: |
          set -e
          mkdir -p binaries
          for pair in "Xray-macos-arm64-v8a.zip:aarch64-apple-darwin" "Xray-macos-64.zip:x86_64-apple-darwin"; do
            ASSET="${pair%%:*}"; TRIPLE="${pair##*:}"
            curl -fSL -o xray.zip "https://github.com/XTLS/Xray-core/releases/latest/download/$ASSET"
            unzip -o xray.zip xray -d xray_tmp
            mv xray_tmp/xray "binaries/xray-$TRIPLE"
            chmod +x "binaries/xray-$TRIPLE"
            rm -rf xray.zip xray_tmp
          done
          lipo -create -output binaries/xray-universal-apple-darwin \
            binaries/xray-aarch64-apple-darwin binaries/xray-x86_64-apple-darwin
          chmod +x binaries/xray-universal-apple-darwin
          lipo -info binaries/xray-universal-apple-darwin

      # ⛔ Артефакты обновления здесь отключаем: они требуют ключ подписи, а
      # этот прогон намеренно идёт без секретов. Форматы задаём флагом, а не
      # правкой tauri.conf.json, чтобы не затронуть рабочие сборки.
      - name: Build universal bundle (unsigned, no updater artifacts)
        working-directory: desktop
        run: |
          npm run tauri build -- --target universal-apple-darwin --bundles app,dmg \
            --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Show what was built
        if: always()
        working-directory: desktop/src-tauri
        run: find target -name "*.dmg" -o -name "*.app" -maxdepth 6 | head -20

      - name: Upload bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexussh-macos-universal
          path: desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: warn
